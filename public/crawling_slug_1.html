<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 260px;
    overflow: hidden;
  }

  .slug {
    position: absolute;
    top: 60%;
    left: -400px;
    width: 260px;
    transform-origin: 50% 50%;
    animation:
      crawl-across 28s linear infinite,
      crawl-squish 0.9s ease-in-out infinite;
    filter: drop-shadow(0 10px 8px rgba(0,0,0,0.25));
  }

  .slug img {
    display: block;
    width: 100%;
    height: auto;
    /* facing right, matches direction of travel */
  }

  @keyframes crawl-across {
    0%   { left: -400px; }
    100% { left: 110%; }
  }

  /* subtle undulating squash-and-stretch to suggest muscular crawling */
  @keyframes crawl-squish {
    0%   { transform: scaleX(1)    scaleY(1)    translateY(0px); }
    25%  { transform: scaleX(1.04) scaleY(0.96) translateY(2px); }
    50%  { transform: scaleX(0.97) scaleY(1.03) translateY(-1px); }
    75%  { transform: scaleX(1.03) scaleY(0.97) translateY(1px); }
    100% { transform: scaleX(1)    scaleY(1)    translateY(0px); }
  }
</style>
</head>
